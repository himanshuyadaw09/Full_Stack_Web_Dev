<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic Tag</title>
  </head>
  <body>
    <header>
      Header
      <nav>Navigation</nav>
    </header>

    <main>
      Main
      <figure>
        <img
          src="https://images.unsplash.com/photo-1788461104998-5375bc251bbf?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDBfHx8fA%3D%3D"
          alt="Alternate text "
          height="300px" width="400px"
        />
        <figcaption>Beautiful image</figcaption>
      </figure>

      <video src="35264-407130725_medium.mp4" controls muted loop poster="https://images.unsplash.com/photo-1788461104998-5375bc251bbf?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDBfHx8fA%3D%3D" height="300px" width="400px"></video>
      
      <iframe width="560" height="315" src="https://www.youtube.com/embed/yiXAmkimZRQ?si=92FndQr9g-CzdkoG" allowfullscreen></iframe>
      
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3458.116715310808!2d78.06399060000003!3d29.91854190000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390949573f6d1d83%3A0xb54fcf81cc9f073f!2sGurukul%20Kangri%20Faculty%20of%20Engineering%20and%20Technology!5e0!3m2!1sen!2sin!4v1788757640463!5m2!1sen!2sin" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>


      <!-- HTML Entities -->
       <p>
        &lt;p&gt; this is paragraph tag
       </p>
    </main>

    <footer>footer</footer>
  </body>
</html>
